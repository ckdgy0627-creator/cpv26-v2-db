name: Validate Live card DB

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog.json'
      - 'players.json'
      - 'cards/**.json'
      - 'tools/validate_db.py'
      - '.github/workflows/validate-livecard-db.yml'
  schedule:
    - cron: '41 1,7,13,19 * * *'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate schema, history, hashes and coverage
        run: python tools/validate_db.py

      - name: Commit validation report
        if: success()
        run: |
          git config user.name 'cpv26-db-bot'
          git config user.email 'cpv26-db-bot@users.noreply.github.com'
          git add research/db_validation_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh DB validation report'
            git push
          fi
